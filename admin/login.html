<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Đăng nhập quản trị Cafe Booking">
<title>Đăng Nhập Admin - Cafe Booking</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f4f1ec 0%, #e5d7c8 100%);
  }
  .login-card {
    width: 100%;
    max-width: 420px;
    border-radius: 24px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.1);
    background: #fff;
    overflow: hidden;
  }
  .login-card .card-body {
    padding: 36px 32px;
  }
  .login-title {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #1f2937;
  }
  .login-subtitle {
    color: #6b7280;
    margin-bottom: 24px;
  }
  .form-control:focus {
    box-shadow: 0 0 0 0.2rem rgba(56, 189, 248, 0.18);
  }
  .btn-login {
    background: linear-gradient(135deg, #0ea5e9, #0284c7);
    color: white;
    font-weight: 600;
    border: none;
  }
  .btn-login:hover {
    background: linear-gradient(135deg, #0284c7, #0ea5e9);
  }
  .login-footer {
    font-size: 0.9rem;
    color: #6b7280;
    margin-top: 18px;
  }
</style>
</head>
<body>
  <div class="login-card shadow">
    <div class="card-body">
      <div class="text-center mb-4">
        <div class="mb-3">
          <span class="fs-1">☕</span>
        </div>
        <h1 class="login-title">Đăng Nhập Admin</h1>
        <p class="login-subtitle">Chỉ admin mới được truy cập vào trang quản lý.</p>
      </div>

      <!-- Tab panes -->
      <div class="tab-content" id="authTabsContent">
        <div class="tab-pane fade show active" id="login" role="tabpanel" aria-labelledby="login-tab">
          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="username" class="form-label">Tên đăng nhập</label>
              <input type="text" id="username" class="form-control" placeholder="admin" required>
              <div class="invalid-feedback">Vui lòng nhập tên đăng nhập.</div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Mật khẩu</label>
              <input type="password" id="password" class="form-control" placeholder="********" required>
              <div class="invalid-feedback">Vui lòng nhập mật khẩu.</div>
            </div>
            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-login btn-lg">Đăng Nhập</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

<script>
  const defaultAdminUser = {
    username: 'admin',
    password: 'admin123'
  };

  function redirectIfLoggedIn() {
    const sessionData = localStorage.getItem('adminSession');
    if (sessionData) {
      try {
        const session = JSON.parse(sessionData);
        if (session && session.username) {
          window.location.href = 'admin.html';
        }
      } catch (err) {
        localStorage.removeItem('adminSession');
      }
    }
  }

  function showValidation(element, message) {
    element.classList.add('is-invalid');
    element.nextElementSibling.textContent = message;
  }

  function clearValidation(element) {
    element.classList.remove('is-invalid');
  }

  document.addEventListener('DOMContentLoaded', () => {
    redirectIfLoggedIn();

    document.getElementById('loginForm').addEventListener('submit', event => {
      event.preventDefault();

      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      clearValidation(usernameInput);
      clearValidation(passwordInput);

      if (!username) {
        showValidation(usernameInput, 'Vui lòng nhập tên đăng nhập.');
        return;
      }
      if (!password) {
        showValidation(passwordInput, 'Vui lòng nhập mật khẩu.');
        return;
      }

      if (username === defaultAdminUser.username && password === defaultAdminUser.password) {
        localStorage.setItem('adminSession', JSON.stringify({ username }));
        window.location.href = 'admin.html';
      } else {
        showValidation(passwordInput, 'Tên đăng nhập hoặc mật khẩu không đúng.');
      }
    });
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
