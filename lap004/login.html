<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Đăng nhập khách hàng Cafe Booking" />
    <title>Đăng Nhập Khách Hàng - Cafe Booking</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          #1f130b 0%,
          #3b291f 45%,
          #26190f 100%
        );
        color: #f5e5d0;
        font-family: "Segoe UI", sans-serif;
      }
      .auth-card {
        width: 100%;
        max-width: 520px;
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.45);
        background: rgba(17, 10, 7, 0.95);
        border: 1px solid rgba(255, 197, 118, 0.18);
      }
      .auth-card .card-body {
        padding: 36px 34px;
      }
      .auth-title {
        font-size: 2rem;
        font-weight: 900;
        color: #ffd79e;
      }
      .auth-subtitle {
        color: #d4b793;
        margin-bottom: 24px;
      }
      .form-control {
        border-radius: 16px;
        border: 1px solid rgba(212, 134, 79, 0.25);
        background: rgba(255, 255, 255, 0.06);
        color: #f7e7cd;
      }
      .form-control::placeholder {
        color: rgba(247, 229, 203, 0.65);
      }
      .form-control:focus {
        border-color: #ffd69a;
        box-shadow: 0 0 0 0.2rem rgba(255, 214, 137, 0.18);
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      .btn-auth {
        background: linear-gradient(135deg, #ffd47f, #e4b166);
        color: #2f1b0f;
        border: none;
        border-radius: 16px;
        font-weight: 800;
      }
      .btn-auth:hover {
        background: linear-gradient(135deg, #e4b366, #ffd47f);
      }
      .auth-footer {
        color: #ceb089;
        margin-top: 18px;
      }
      .invalid-feedback {
        color: #ffa9a3;
      }
      .auth-note {
        color: #f6e4ca;
        margin-top: 16px;
      }
      .back-home-link {
        color: #ffe7c0;
        font-weight: 700;
        text-decoration: none;
        background: rgba(255, 237, 191, 0.12);
        padding: 8px 14px;
        border-radius: 12px;
        transition:
          background 0.25s ease,
          color 0.25s ease;
      }
      .back-home-link:hover {
        color: #1a0f08;
        background: rgba(255, 237, 191, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="auth-card shadow-lg">
      <div class="card-body">
        <div class="text-center mb-4">
          <div class="mb-3">
            <span class="fs-1">☕</span>
          </div>
          <h1 class="auth-title">Đăng Nhập / Đăng Ký</h1>
          <p class="auth-subtitle">
            Đăng nhập khách hàng để đặt món và đặt bàn.
          </p>
        </div>

        <ul
          class="nav nav-tabs nav-justified mb-4"
          id="authTabs"
          role="tablist"
        >
          <li class="nav-item" role="presentation">
            <button
              class="nav-link active"
              id="login-tab"
              data-bs-toggle="tab"
              data-bs-target="#login"
              type="button"
              role="tab"
              aria-controls="login"
              aria-selected="true"
            >
              Đăng Nhập
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="register-tab"
              data-bs-toggle="tab"
              data-bs-target="#register"
              type="button"
              role="tab"
              aria-controls="register"
              aria-selected="false"
            >
              Đăng Ký
            </button>
          </li>
        </ul>

        <div class="tab-content" id="authTabContent">
          <div
            class="tab-pane fade show active"
            id="login"
            role="tabpanel"
            aria-labelledby="login-tab"
          >
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="loginPhone" class="form-label">Số điện thoại</label>
                <input
                  id="loginPhone"
                  type="tel"
                  class="form-control"
                  placeholder="0912345678"
                  required
                />
                <div class="invalid-feedback">Vui lòng nhập số điện thoại.</div>
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">Mật khẩu</label>
                <input
                  id="loginPassword"
                  type="password"
                  class="form-control"
                  placeholder="Mật khẩu"
                  required
                />
                <div class="invalid-feedback">Vui lòng nhập mật khẩu.</div>
              </div>
              <div class="d-grid mt-3">
                <button type="submit" class="btn btn-auth btn-lg">
                  Đăng Nhập
                </button>
              </div>
            </form>
          </div>

          <div
            class="tab-pane fade"
            id="register"
            role="tabpanel"
            aria-labelledby="register-tab"
          >
            <form id="registerForm" novalidate>
              <div class="mb-3">
                <label for="regName" class="form-label">Họ Tên</label>
                <input
                  id="regName"
                  type="text"
                  class="form-control"
                  placeholder="Nguyễn Văn A"
                  required
                />
                <div class="invalid-feedback">Vui lòng nhập họ tên.</div>
              </div>
              <div class="mb-3">
                <label for="regPhone" class="form-label">Số điện thoại</label>
                <input
                  id="regPhone"
                  type="tel"
                  class="form-control"
                  placeholder="0912345678"
                  required
                />
                <div class="invalid-feedback">Vui lòng nhập số điện thoại.</div>
              </div>
              <div class="mb-3">
                <label for="regPassword" class="form-label">Mật khẩu</label>
                <input
                  id="regPassword"
                  type="password"
                  class="form-control"
                  placeholder="Tối thiểu 6 ký tự"
                  required
                />
                <div class="invalid-feedback">
                  Vui lòng nhập mật khẩu ít nhất 6 ký tự.
                </div>
              </div>
              <div class="d-grid mt-3">
                <button type="submit" class="btn btn-auth btn-lg">
                  Đăng Ký
                </button>
              </div>
            </form>
          </div>
        </div>

        <p class="auth-note text-center">
          Đã có tài khoản? Chuyển sang tab Đăng Nhập để tiếp tục.
        </p>
        <div class="text-center mt-3">
          <a href="index.html" class="back-home-link">← Quay lại trang chủ</a>
        </div>
      </div>
    </div>

    <script>
      function getCustomerUsers() {
        try {
          return JSON.parse(localStorage.getItem("customerUsers") || "[]");
        } catch (error) {
          return [];
        }
      }

      function saveCustomerUsers(users) {
        localStorage.setItem("customerUsers", JSON.stringify(users));
      }

      function setCustomerSession(user) {
        localStorage.setItem(
          "customerSession",
          JSON.stringify({
            name: user.name,
            phone: user.phone,
          }),
        );
      }

      function getCustomerSession() {
        try {
          return JSON.parse(localStorage.getItem("customerSession") || "null");
        } catch (error) {
          return null;
        }
      }

      function redirectIfLoggedIn() {
        const session = getCustomerSession();
        if (session && session.name) {
          window.location.href = "index.html";
        }
      }

      function showValidation(element, message) {
        element.classList.add("is-invalid");
        element.nextElementSibling.textContent = message;
      }

      function clearValidation(element) {
        element.classList.remove("is-invalid");
      }

      document.addEventListener("DOMContentLoaded", () => {
        redirectIfLoggedIn();

        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");

        loginForm.addEventListener("submit", (event) => {
          event.preventDefault();

          const phoneInput = document.getElementById("loginPhone");
          const passwordInput = document.getElementById("loginPassword");
          const phone = phoneInput.value.trim();
          const password = passwordInput.value.trim();

          clearValidation(phoneInput);
          clearValidation(passwordInput);

          if (!phone) {
            showValidation(phoneInput, "Vui lòng nhập số điện thoại.");
            return;
          }
          if (!/^0\d{9,10}$/.test(phone)) {
            showValidation(
              phoneInput,
              "Số điện thoại phải bắt đầu 0 và có 10-11 chữ số.",
            );
            return;
          }
          if (!password) {
            showValidation(passwordInput, "Vui lòng nhập mật khẩu.");
            return;
          }

          const users = getCustomerUsers();
          const user = users.find(
            (u) => u.phone === phone && u.password === password,
          );
          if (!user) {
            showValidation(
              passwordInput,
              "Số điện thoại hoặc mật khẩu không đúng.",
            );
            return;
          }

          setCustomerSession(user);
          window.location.href = "index.html";
        });

        registerForm.addEventListener("submit", (event) => {
          event.preventDefault();

          const nameInput = document.getElementById("regName");
          const phoneInput = document.getElementById("regPhone");
          const passwordInput = document.getElementById("regPassword");

          const name = nameInput.value.trim();
          const phone = phoneInput.value.trim();
          const password = passwordInput.value.trim();

          clearValidation(nameInput);
          clearValidation(phoneInput);
          clearValidation(passwordInput);

          if (!name) {
            showValidation(nameInput, "Vui lòng nhập họ tên.");
            return;
          }
          if (!phone) {
            showValidation(phoneInput, "Vui lòng nhập số điện thoại.");
            return;
          }
          if (!/^0\d{9,10}$/.test(phone)) {
            showValidation(
              phoneInput,
              "Số điện thoại phải bắt đầu 0 và có 10-11 chữ số.",
            );
            return;
          }
          if (!password || password.length < 6) {
            showValidation(passwordInput, "Mật khẩu phải ít nhất 6 ký tự.");
            return;
          }

          const users = getCustomerUsers();
          if (users.some((u) => u.phone === phone)) {
            showValidation(
              phoneInput,
              "Số điện thoại này đã được đăng ký. Vui lòng đăng nhập.",
            );
            return;
          }

          const newUser = { name, phone, password };
          users.push(newUser);
          saveCustomerUsers(users);
          setCustomerSession(newUser);
          window.location.href = "index.html";
        });
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
